name: Build Backend

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Grant execute permission
        run: chmod +x mvnw

      - name: Build project
        run: ./mvnw clean verify

  postgres-flyway:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: liderum_ci
          POSTGRES_USER: liderum_ci
          POSTGRES_PASSWORD: liderum_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U liderum_ci -d liderum_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Grant execute permission
        run: chmod +x mvnw

      - name: Validate Flyway against PostgreSQL
        env:
          SPRING_PROFILES_ACTIVE: prod
          DB_URL: jdbc:postgresql://localhost:5432/liderum_ci
          DB_USERNAME: liderum_ci
          DB_PASSWORD: liderum_ci_only
          JWT_SECRET: test_only_postgresql_ci_secret_32_bytes_minimum
        run: ./mvnw -Dtest=PostgreSqlFlywaySchemaCiIT test
