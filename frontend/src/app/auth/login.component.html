<main class="auth-page login-page">
  <div class="auth-backdrop" aria-hidden="true"></div>

  <section class="auth-surface login-surface" aria-labelledby="login-title">
    <form [formGroup]="form" (ngSubmit)="onSubmit()" [attr.aria-busy]="isLoading">
      <h1 id="login-title">Login</h1>

      <mat-form-field appearance="outline" class="auth-field">
        <mat-icon matPrefix aria-hidden="true">person</mat-icon>
        <mat-label>Usuário</mat-label>
        <input matInput formControlName="username" autocomplete="username" />
      </mat-form-field>

      <mat-form-field appearance="outline" class="auth-field">
        <mat-icon matPrefix aria-hidden="true">vpn_key</mat-icon>
        <mat-label>Senha</mat-label>
        <input matInput type="password" formControlName="password" autocomplete="current-password" />
      </mat-form-field>

      <button mat-raised-button color="primary" class="auth-submit" type="submit" [disabled]="form.invalid || isLoading">
        Entrar
      </button>

      <a routerLink="/register" class="auth-link">Criar uma Guild</a>
    </form>
  </section>
</main>
