<div class="sidebar-header">
  <h3>Menu</h3>
  <button class="close-btn" *ngIf="isHandset" (click)="closeSidenav.emit()" aria-label="Fechar menu">
    <mat-icon>close</mat-icon>
  </button>
</div>

<a class="menu-btn" routerLink="/dashboard" routerLinkActive="active" ariaCurrentWhenActive="page" (click)="closeIfHandset()">
  <mat-icon>dashboard</mat-icon>
  Dashboard
</a>
<a class="menu-btn" routerLink="/members" routerLinkActive="active" ariaCurrentWhenActive="page" (click)="closeIfHandset()">
  <mat-icon>group</mat-icon>
  Members
</a>
<a class="menu-btn" routerLink="/teams" routerLinkActive="active" ariaCurrentWhenActive="page" (click)="closeIfHandset()">
  <mat-icon>groups</mat-icon>
  Grupos
</a>
<a class="menu-btn" routerLink="/events" routerLinkActive="active" ariaCurrentWhenActive="page" (click)="closeIfHandset()">
  <mat-icon>event</mat-icon>
  Eventos
</a>
<a class="menu-btn" routerLink="/attendance" routerLinkActive="active" ariaCurrentWhenActive="page" (click)="closeIfHandset()">
  <mat-icon>check_circle</mat-icon>
  Presença
</a>
<ng-container *ngIf="profile$ | async as profile">
  <a *ngIf="profile.guildRole === 'MARECHAL' || profile.guildRole === 'GENERAL'"
     class="menu-btn" routerLink="/users" routerLinkActive="active"
     ariaCurrentWhenActive="page" (click)="closeIfHandset()">
    <mat-icon>manage_accounts</mat-icon>
    Usuários
  </a>
</ng-container>
<div class="sidebar-spacer"></div>

<button class="menu-btn logout-btn" (click)="logout()">
  <mat-icon>logout</mat-icon>
  Sair
</button>
