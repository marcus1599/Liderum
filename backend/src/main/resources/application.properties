server.port=${PORT:8080}
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:604800000}

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=false
spring.jpa.hibernate.ddl-auto=validate

liderum.registration.rate-limit.limit=${REGISTRATION_RATE_LIMIT_LIMIT:5}
liderum.registration.rate-limit.window=${REGISTRATION_RATE_LIMIT_WINDOW:15m}
liderum.registration.rate-limit.max-clients=${REGISTRATION_RATE_LIMIT_MAX_CLIENTS:10000}

spring.rabbitmq.addresses=${CLOUDAMQP_URL:${RABBITMQ_ADDRESSES:amqp://guest:guest@localhost:5672}}

liderum.rabbitmq.exchange=${LIDERUM_RABBITMQ_EXCHANGE:liderum.events}
liderum.rabbitmq.guild-event-created-routing-key=${LIDERUM_RABBITMQ_GUILD_EVENT_CREATED_ROUTING_KEY:guild.event.created}
liderum.rabbitmq.guild-event-created-queue=${LIDERUM_RABBITMQ_GUILD_EVENT_CREATED_QUEUE:notification.guild-event-created}
